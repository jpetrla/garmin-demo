services:

  postgres:
    image: postgres:18

    environment:
      POSTGRES_DB: garmin_demo
      POSTGRES_USER: garmin
      POSTGRES_PASSWORD: garmin

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garmin -d garmin_demo"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .

    environment:
      # Inside the compose network the database is reachable by its service name, not localhost.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/garmin_demo

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
